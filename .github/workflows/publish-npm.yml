name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_version:
        description: Existing package version to publish after a failed release
        required: false
        type: string

permissions:
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_version != '' && format('v{0}', inputs.recovery_version) || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Show npm trusted-publisher identity
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', 'npm:registry.npmjs.org')

          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!response.ok)
            throw new Error(`Could not request OIDC identity: ${response.status}`)

          const { value } = await response.json()
          const claim = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString())
          console.log(JSON.stringify({
            repository: claim.repository,
            workflow_ref: claim.workflow_ref,
            environment: claim.environment,
          }, null, 2))
          NODE

      - name: Verify recovery version
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_version != ''
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"

          if [ "$package_version" != "$RECOVERY_VERSION" ]; then
            echo "::error::package.json contains $package_version, not $RECOVERY_VERSION"
            exit 1
          fi

          if npm view "@dremchee/uframe@$RECOVERY_VERSION" version >/dev/null 2>&1; then
            echo "::error::@dremchee/uframe@$RECOVERY_VERSION is already published"
            exit 1
          fi

      - name: Publish existing version
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_version != ''
        run: npm publish --access public

      - name: Release from Conventional Commits
        if: github.event_name != 'workflow_dispatch' || inputs.recovery_version == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes --package semantic-release@24 --package @semantic-release/exec --package @semantic-release/git semantic-release
